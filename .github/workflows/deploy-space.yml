name: Deploy clip explorer to HF Space

on:
  push:
    branches: [main]
    paths:
      - "clip_explorer/**"
      - "retargeting/utils/clip_names.py"
      - "curation/test_split.json"
      - "space/**"
      - ".github/workflows/deploy-space.yml"
  workflow_dispatch:

# never let two deploys race the same Space
concurrency:
  group: hf-space
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # The target Space may be configured as either a repository variable or a
      # secret. It cannot be checked in a job-level `if:` because the `secrets`
      # context is not available there, so the gate lives in this step instead.
      - name: Resolve target
        id: cfg
        env:
          SPACE_VAR: ${{ vars.HF_SPACE_REPO }}
          SPACE_SECRET: ${{ secrets.HF_SPACE_REPO }}
        run: |
          SPACE="${SPACE_VAR:-$SPACE_SECRET}"
          if [ -z "$SPACE" ]; then
            echo "::notice::HF_SPACE_REPO is not set — skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ready == 'true'

      - uses: actions/setup-python@v5
        if: steps.cfg.outputs.ready == 'true'
        with:
          python-version: "3.10"

      - name: Stage the Space
        if: steps.cfg.outputs.ready == 'true'
        run: |
          mkdir -p space_build
          # the Space builds the frontend itself (Dockerfile stage 1), so ship
          # sources, not a prebuilt bundle
          cp space/Dockerfile space/README.md space_build/
          mkdir -p space_build/clip_explorer space_build/retargeting/utils space_build/curation
          cp clip_explorer/app.py clip_explorer/hf_data.py space_build/clip_explorer/
          cp -r clip_explorer/frontend space_build/clip_explorer/frontend
          rm -rf space_build/clip_explorer/frontend/node_modules \
                 space_build/clip_explorer/frontend/dist
          cp retargeting/utils/clip_names.py space_build/retargeting/utils/
          cp curation/test_split.json space_build/curation/

      - name: Upload
        if: steps.cfg.outputs.ready == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SPACE_VAR: ${{ vars.HF_SPACE_REPO }}
          SPACE_SECRET: ${{ secrets.HF_SPACE_REPO }}
        run: |
          pip install --quiet "huggingface_hub>=0.34"
          SPACE="${SPACE_VAR:-$SPACE_SECRET}" python - <<'PY'
          import os
          from huggingface_hub import HfApi
          space = os.environ["SPACE"]
          api = HfApi(token=os.environ["HF_TOKEN"])
          api.create_repo(space, repo_type="space", space_sdk="docker",
                          exist_ok=True)
          api.upload_folder(
              repo_id=space, repo_type="space", folder_path="space_build",
              commit_message=f"deploy {os.environ.get('GITHUB_SHA', '')[:7]}",
              delete_patterns=["**"],     # keep the Space an exact mirror
          )
          print("deployed (Space name hidden if configured as a secret)")
          PY
