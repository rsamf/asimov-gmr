[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asimov-gmr"
version = "1.0.0"
description = "Retarget AMASS human motion onto the asimov humanoid, with per-clip QA, difficulty tagging and a review UI"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Richard Franklin" }]
keywords = ["robotics", "humanoid", "motion-retargeting", "amass", "mujoco", "smpl-x"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "torch", "mujoco", "mink", "smplx", "scipy", "numpy",
  "flask", "imageio", "imageio-ffmpeg", "natsort", "rich",
  "huggingface_hub",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/rsamf/asimov-gmr"
Robot = "https://github.com/menloresearch/asimov-1"

[project.scripts]
asimov-gmr = "retargeting.pipeline:main"

[tool.setuptools.packages.find]
include = ["retargeting*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
